# GoReleaser configuration for locklog.
#
# Local dry run (no signing, no publishing):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign
#
# A tag v* pushed to GitHub runs .github/workflows/release.yml, which needs
# cosign and syft on PATH. The release is created as a draft: the workflow
# publishes it only once the images are signed and pulled anonymously, so
# install.sh (which takes the latest published release) never sees a
# release whose image is missing.
version: 2

project_name: locklog

before:
  hooks:
    - go mod download

builds:
  - id: locklog
    main: ./cmd/locklog
    binary: locklog
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: locklog
    ids: [locklog]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit list. scripts/locklog is the host launcher that
    # scripts/install.sh and `locklog update` install; the binary is the
    # client an agent's own container copies.
    files:
      - src: scripts/locklog
        info:
          mode: 0755
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature of the checksum file (GitHub OIDC in CI). Verify
# with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/DavidGodefroid/locklog/\.github/workflows/release\.yml@refs/tags/v[0-9]' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    output: true

# One SPDX SBOM per archive, generated by syft.
sboms:
  - id: archives
    artifacts: archive

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: DavidGodefroid
    name: locklog
  prerelease: auto
  # Published by the last job of release.yml.
  draft: true
