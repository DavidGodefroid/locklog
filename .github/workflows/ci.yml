name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      # The Landlock tests must run, not skip, on the Linux runner.
      LOCKLOG_REQUIRE_LANDLOCK_ABI: ${{ matrix.os == 'ubuntu-latest' && '5' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            # Surface the failures as annotations, readable without the logs.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # The engine and the sources under the race detector (cgo, -short: the
  # heaviest equivalence cases run in full in the test job above). The
  # engine's read-around tests (tail, context, trace) run in a shard of
  # their own: under -race they take as long as the rest.
  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: engine read-around
            args: -run '^(TestTail|TestContext|TestTrace)' ./internal/engine/
          - shard: engine, sources
            args: -skip '^(TestTail|TestContext|TestTrace)' ./internal/engine/ ./internal/source/...
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go test -race -short
        shell: bash
        run: |
          set -o pipefail
          go test -race -short -timeout 30m ${{ matrix.args }} 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:|WARNING: DATA RACE' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # Windows: the module builds and its unit tests run, but the locklog
  # console itself runs only on Linux (in Docker). Test files that need Unix
  # accounts, file modes, sockets or terminals carry `//go:build unix`.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      # Keep LF line endings: fixtures and golden text are compared byte
      # for byte.
      - name: git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # Remote sources against real backends (pulled images, no local build).
  integration-loki:
    name: integration (loki)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: start Loki
        run: |
          docker run -d --name loki -p 127.0.0.1:3100:3100 grafana/loki:3.5.7
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ready >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs loki | tail -50
          exit 1
      - name: integration tests
        env:
          LOCKLOG_LOKI_URL: http://127.0.0.1:3100
        run: go test -tags integration -count=1 ./test/loki/...
      - name: backend logs on failure
        if: failure()
        run: docker logs loki 2>&1 | tail -100

  # The Elasticsearch source against Elasticsearch 8 and OpenSearch 2, both
  # with security on (OpenSearch: the security plugin's demo configuration,
  # TLS on the transport layer only), from pulled images. The tests create
  # read-only and write-capable users and check the production refusal.
  integration-elastic:
    name: integration (elasticsearch, opensearch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
      OS_ADMIN_PW: "Zq8#Vt3rLp!kW7xN-ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: start Elasticsearch and OpenSearch
        run: |
          docker run -d --name es -p 127.0.0.1:9200:9200 -e discovery.type=single-node \
            -e xpack.security.enabled=true -e xpack.security.http.ssl.enabled=false \
            -e ELASTIC_PASSWORD=ci-elastic-pw -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          docker run -d --name os -p 127.0.0.1:9201:9200 -e discovery.type=single-node \
            -e "OPENSEARCH_INITIAL_ADMIN_PASSWORD=$OS_ADMIN_PW" -e plugins.security.ssl.http.enabled=false \
            -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" opensearchproject/opensearch:2.17.1
          for i in $(seq 1 120); do
            if curl -fsS -u elastic:ci-elastic-pw http://127.0.0.1:9200/_cluster/health >/dev/null 2>&1 &&
              curl -fsS -u "admin:$OS_ADMIN_PW" http://127.0.0.1:9201/_plugins/_security/authinfo >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs es | tail -50
          docker logs os | tail -50
          exit 1
      - name: OpenSearch refuses an anonymous read
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9201/_cat/indices)" = 401
      - name: integration tests
        env:
          LOCKLOG_ES_URL: http://127.0.0.1:9200
          LOCKLOG_ES_ADMIN: elastic:ci-elastic-pw
          LOCKLOG_OPENSEARCH_URL: http://127.0.0.1:9201
        run: LOCKLOG_OPENSEARCH_ADMIN="admin:$OS_ADMIN_PW" go test -tags integration -count=1 -v ./test/elastic/...
      - name: backend logs on failure
        if: failure()
        run: |
          docker logs es 2>&1 | tail -100
          docker logs os 2>&1 | tail -100

  # Every fuzz target for a short time; run scripts/fuzz.sh with a longer
  # FUZZTIME locally for deeper runs.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: fuzz
        run: GOMAXPROCS=2 FUZZTIME=20s sh scripts/fuzz.sh
      - name: keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # The README/site demo is scripts/brand/demo.py's output and names only
  # tools and pseudonym kinds the code has.
  demo:
    name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: demo golden test
        run: python3 scripts/brand/check_demo.py

  # Sources against the runner's own services: journald (the source reads
  # /var/log/journal as root, like a console with the journal group would).
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: journald
        shell: bash
        run: |
          set -o pipefail
          go test -c -o journald.test ./internal/source/journald/
          sudo LOCKLOG_JOURNALD_IT=1 ./journald.test -test.run '^TestLiveJournal$' -test.v | tee it.log
          grep -q -- '--- PASS: TestLiveJournal' it.log

  # The heavy LL-16 suites, on every pull request: the leak suite with every
  # canary kind in every encoding written into every query position, the
  # approval tools' suites (scan, unmask, lookup, change requests), every
  # source including Loki (a real one here), the
  # oracle, the equivalence suites, and the latency cases of the oracle
  # (repeated, interleaved runs on production and non-production defaults,
  # idle and under a CPU hog, compared statistically). The test job runs
  # the quick suites (injection, the agent-rule leak case, incident (a)).
  suites:
    name: suites (leak, oracle, equivalence, latency)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      # The suites' Loki source reads a real Loki here (the test job's
      # runs use the fake Loki of suite_loki_test.go).
      - name: start Loki
        run: |
          docker run -d --name loki -p 127.0.0.1:3100:3100 \
            -v "$PWD/test/loki/incident-config.yaml:/etc/loki/incident.yaml:ro" \
            grafana/loki:3.5.7 -config.file=/etc/loki/incident.yaml
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ready >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs loki | tail -50
          exit 1
      - name: suites
        shell: bash
        env:
          LOCKLOG_SUITE_LOKI_URL: http://127.0.0.1:3100
        run: |
          set -o pipefail
          GOMAXPROCS=2 LOCKLOG_SUITES=1 LOCKLOG_SUITE_FULL=1 LOCKLOG_SUITE_TIMING=1 go test -count=1 -timeout 60m -v \
            -run '^(TestSuite|TestLeakScanner)' -skip '^TestSuiteOracleLatency$' ./internal/engine/ 2>&1 |
            grep -v -E '^=== (RUN|PAUSE|CONT)|: [0-9]+ pages in |: scanned in ' | tee suites.log
      - name: Loki logs on failure
        if: failure()
        run: docker logs loki 2>&1 | tail -100

  # The oracle's latency cases (repeated, interleaved runs, idle and under a
  # CPU hog, compared statistically) over every source, Loki's being the
  # suites' fake Loki on loopback: against the real Loki the 25 x 2 runs
  # per case take over 40 minutes, and the network adds noise the oracle
  # does not measure (what the engine's work reveals).
  suites-latency:
    name: suites (latency)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: latency
        shell: bash
        run: |
          set -o pipefail
          GOMAXPROCS=2 LOCKLOG_SUITES=1 LOCKLOG_SUITE_TIMING=1 go test -count=1 -timeout 60m -v \
            -run '^TestSuiteOracleLatency$' ./internal/engine/ 2>&1 |
            grep -v -E '^=== (RUN|PAUSE|CONT)' | tee latency.log

  # Local incident (b) at realistic volume (R6-P1): 7 days x 1 GiB/day of
  # nginx and journald (a quarter of that: the journal history imported by
  # systemd-journal-remote in export format with past timestamps); job 1
  # warm and cold, idle and with the host slowed 3x; no prompt (<= 3); warm
  # within 5 min, cold within 5 min plus the backfill (1.5x the warm build).
  incidents:
    name: incidents (local, realistic volume)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: systemd-journal-remote
        run: sudo apt-get update -q && sudo apt-get install -y -q systemd-journal-remote
      - name: incidents
        shell: bash
        run: |
          set -o pipefail
          # About 12 GiB of data: the runner's larger temporary disk when
          # there is one.
          dir="${RUNNER_TEMP}"
          if [ -d /mnt ] && sudo mkdir -p /mnt/incidents && sudo chown "$(id -u):$(id -g)" /mnt/incidents; then dir=/mnt/incidents; fi
          df -h "$dir"
          TMPDIR="$dir" GOMAXPROCS=2 LOCKLOG_INCIDENT_VOLUME=1GiB \
            LOCKLOG_JOURNAL_REMOTE=/usr/lib/systemd/systemd-journal-remote \
            go test -count=1 -timeout 85m -v -run '^(TestIncidentOrder4812|TestIncidentVolume)$' ./internal/engine/ 2>&1 |
            grep -v -E '^=== (RUN|PAUSE|CONT)' | tee incidents.log

  # TestLokiIncident (design §9.1, R6-P2) against a real Loki started with
  # the documented ingest overrides (test/loki/incident-config.yaml,
  # docs/loki.md) and a Toxiproxy for the latency variant: two containers.
  # A dense hour at 5 GiB/day over a sparse 7-day background, pushed with
  # and without a level label (about 1.5 GiB of lines, ingested within
  # 10 min); job 1 by the scripted agent in every variant: <= 3 prompts,
  # the answer within 5 min.
  loki-incident:
    name: Loki incident (TestLokiIncident)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: start Loki and Toxiproxy
        run: |
          docker run -d --name loki --network host \
            -v "$PWD/test/loki/incident-config.yaml:/etc/loki/incident.yaml:ro" \
            grafana/loki:3.5.7 -config.file=/etc/loki/incident.yaml
          docker run -d --name toxiproxy --network host ghcr.io/shopify/toxiproxy:2.9.0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ready >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8474/version >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs loki | tail -50
          docker logs toxiproxy | tail -20
          exit 1
      - name: TestLokiIncident
        shell: bash
        env:
          LOCKLOG_LOKI_INCIDENT_URL: http://127.0.0.1:3100
          LOCKLOG_TOXIPROXY_URL: http://127.0.0.1:8474
        run: |
          set -o pipefail
          df -h /
          GOMAXPROCS=2 go test -count=1 -timeout 55m -v -run '^TestLokiIncident$' ./internal/engine/ 2>&1 |
            grep -v -E '^=== (RUN|PAUSE|CONT)' | tee loki-incident.log
      - name: backend logs on failure
        if: failure()
        run: |
          docker logs loki 2>&1 | tail -100
          docker logs toxiproxy 2>&1 | tail -30

  # The approved-scan test (design §9.1, R5-P3): a 20 GiB approved scan on
  # local files, generated on the runner's larger temporary disk, completes
  # across continuations on one approval within its 30-minute TTL.
  scan-volume:
    name: approved scan (20 GiB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: approved scan
        shell: bash
        run: |
          set -o pipefail
          dir="${RUNNER_TEMP}"
          if [ -d /mnt ] && sudo mkdir -p /mnt/scan && sudo chown "$(id -u):$(id -g)" /mnt/scan; then dir=/mnt/scan; fi
          df -h / "$dir"
          LOCKLOG_SCAN_DIR="$dir" LOCKLOG_SCAN_VOLUME=20GiB GOMAXPROCS=2 \
            go test -count=1 -timeout 55m -v -run '^TestApprovedScanVolume$' ./internal/engine/ 2>&1 |
            grep -v -E '^=== (RUN|PAUSE|CONT)' | tee scan-volume.log

  # One required check name ("lint") for every static check; later pull
  # requests add steps here (goreleaser check, install.sh rules, ...).
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hygiene (no internal names in tracked files)
        run: sh scripts/hygiene.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt: these files need formatting:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: shellcheck (launcher, install.sh, hygiene)
        run: shellcheck -S warning -s sh scripts/locklog scripts/install.sh scripts/hygiene.sh
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

  # main's scripts/install.sh is what locklog.dev serves: once a release
  # exists, it changes only in a release pull request (title "release:"),
  # so that it always matches the released logic. A convention the review
  # holds, not a security control: anyone can title a pull request.
  install-sh-rule:
    name: install.sh changes only in release PRs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$(git tag -l 'v[0-9]*')" ]; then
            echo "::notice::no release yet: install.sh may change in any pull request"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- scripts/install.sh; then exit 0; fi
          case "$TITLE" in
          release:*) echo "release pull request: install.sh may change" ;;
          *) echo "::error::scripts/install.sh changes only in a release pull request (title starting with \"release:\")"; exit 1 ;;
          esac

  # The image: built here (never on a developer machine), its accounts,
  # system file and socket directory checked, ALLOWED_UIDS refusals, and
  # the launcher running commands in it.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build
        run: docker build -t locklog .
      - name: accounts, system file, socket directory
        run: |
          set -x
          test "$(docker run --rm --entrypoint id locklog -u)" = 10052
          test "$(docker run --rm --entrypoint id locklog -G)" = 10050
          test "$(docker run --rm --user locklog --entrypoint id locklog -u)" = 10051
          test "$(docker run --rm --entrypoint stat locklog -c '%u:%g:%a' /run/locklog)" = 10051:10050:2750
          test "$(docker run --rm --entrypoint stat locklog -c '%u:%g:%a' /home/locklog)" = 10051:10051:700
          docker run --rm --entrypoint cat locklog /etc/locklog/system.toml | grep -x 'client_group = "locklog-clients"'
          if docker run --rm --entrypoint sh locklog -c 'ls /var/run/docker.sock' 2>/dev/null; then exit 1; fi
          docker inspect locklog --format '{{index .Config.Labels "org.opencontainers.image.source"}}' | grep -x https://github.com/DavidGodefroid/locklog
      - name: docker build with ALLOWED_UIDS
        run: |
          docker build --build-arg ALLOWED_UIDS=4242,4243 -t locklog-allowed .
          docker run --rm --entrypoint cat locklog-allowed /etc/locklog/system.toml | grep -x 'allowed_uids = \[4242,4243\]'
          for bad in '1,,2' '0' '1000,0' '10051' '007' '65534' 'a'; do
            if docker build --build-arg ALLOWED_UIDS="$bad" . >/dev/null 2>&1; then echo "ALLOWED_UIDS=$bad accepted" >&2; exit 1; fi
          done
      - name: docker build --target vault
        run: |
          docker build --target vault -t locklog:vault .
          docker run --rm --user locklog --entrypoint vault locklog:vault version
      - name: the launcher runs commands in the image
        run: |
          set -x
          sh scripts/locklog version | grep -x 'locklog launcher dev (image locklog)'
          sh scripts/locklog version | grep -x 'locklog dev'
          mkdir -p "$RUNNER_TEMP/proj/.locklog" && cd "$RUNNER_TEMP/proj"
          printf '%s\n' 'version = 1' '[profiles.staging.sources.syslog]' 'kind = "file"' 'paths = ["/var/log/syslog*"]' \
            '[profiles.staging.sources.sys]' 'kind = "journald"' > .locklog/config.toml
          sh "$GITHUB_WORKSPACE/scripts/locklog" mounts | tee plan.txt
          grep -x 'profile staging false' plan.txt
          grep -x 'file /var/log /var/log/syslog\*' plan.txt
          grep -x journald plan.txt

  # The docker source against a real engine: containers with rotated,
  # compressed json-file logs, the map written by `locklog refresh`, and the
  # source's test binary run in a container confined like the console.
  docker-source:
    name: docker source (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      IMG: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: docker build -t locklog .
      - name: containers with rotated, compressed logs
        run: |
          set -eux
          r="ll11-it-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          echo "R=$r" >> "$GITHUB_ENV"
          docker pull -q "$IMG"
          gen='i=0; while [ $i -lt 3000 ]; do echo "$0 line $i with some padding text"; i=$((i+1)); done; echo "$0 to stderr" >&2'
          opts="--log-driver json-file --log-opt max-size=20k --log-opt max-file=3 --log-opt compress=true"
          for n in "$r-a" "$r-b" "other-$r"; do docker run -d --name "$n" $opts "$IMG" sh -c "$gen" "$n"; done
          docker run -d --name "locklog-console-it-$r" --label locklog.console=1 $opts "$IMG" sh -c "$gen" console
          docker run -d --name "$r-local" --log-driver local "$IMG" sh -c "$gen" local
          docker wait "$r-a" "$r-b" "other-$r" "locklog-console-it-$r" "$r-local"
          sleep 3 # rotated files are compressed in the background
          mkdir -p "$RUNNER_TEMP/it/expect"
          for n in "$r-a" "$r-b"; do docker logs "$n" > "$RUNNER_TEMP/it/expect/$n" 2>&1; done
          wc -l "$RUNNER_TEMP"/it/expect/*
      - name: locklog refresh writes the map
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/proj/.locklog" && cd "$RUNNER_TEMP/proj"
          printf '%s\n' 'version = 1' '[profiles.it.sources.web]' 'kind = "docker"' "containers = [\"$R-*\"]" > .locklog/config.toml
          mkdir -m 0700 "$RUNNER_TEMP/xdg"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" sh "$GITHUB_WORKSPACE/scripts/locklog" refresh | tee refresh.txt
          grep -q ': 2 mapped, 1 console containers excluded, 1 skipped' refresh.txt
          cat "$RUNNER_TEMP"/xdg/locklog/map/locklog-console-*/map.v1
      - name: read in a container confined like the console
        shell: bash
        run: |
          set -euxo pipefail
          go test -c -tags integration -o "$RUNNER_TEMP/it/docker.test" ./internal/source/docker
          root="$(docker info --format '{{.DockerRootDir}}')/containers"
          mapdir=$(echo "$RUNNER_TEMP"/xdg/locklog/map/locklog-console-*)
          console_id=$(docker inspect --format '{{.Id}}' "locklog-console-it-$R")
          docker run --rm --user 10051:10051 --group-add 0 --cap-drop ALL --security-opt no-new-privileges \
            --read-only --network none --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$root,dst=$root,readonly,bind-recursive=disabled" \
            --mount "type=bind,src=$mapdir,dst=/run/locklog-map,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/it,dst=/it,readonly" \
            -e "LOCKLOG_DOCKER_ROOT=$root" -e "LL11_GLOB=$R-*" -e LL11_EXPECT=/it/expect \
            -e "LL11_CONSOLE_ID=$console_id" -e "LL11_CONSOLE_NAME=locklog-console-it-$R" \
            "$IMG" /it/docker.test -test.v -test.run Integration | tee it.log
          for t in ReadsApprovedContainers NeverServesConsoles CannotListOrWrite; do
            grep -q -- "--- PASS: TestIntegration$t" it.log
          done
      - name: Landlock, and a mount propagated after the reader started
        shell: bash
        run: |
          set -euxo pipefail
          root="$(docker info --format '{{.DockerRootDir}}')/containers"
          mapdir=$(echo "$RUNNER_TEMP"/xdg/locklog/map/locklog-console-*)
          sync="$RUNNER_TEMP/sync"
          mkdir -m 0777 "$sync"
          # The reader restricts itself, says it is ready, then waits for
          # the shareable container's id.
          docker run -d --name "$R-reader" --user 10051:10051 --group-add 0 --cap-drop ALL --security-opt no-new-privileges \
            --read-only --network none --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$root,dst=$root,readonly,bind-recursive=disabled" \
            --mount "type=bind,src=$mapdir,dst=/run/locklog-map,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/it,dst=/it,readonly" \
            --mount "type=bind,src=$sync,dst=/sync" \
            -e "LOCKLOG_DOCKER_ROOT=$root" -e "LL11_GLOB=$R-*" -e LL11_SYNC=/sync \
            "$IMG" /it/docker.test -test.v -test.run '^TestIntegrationLandlockShm$'
          for _ in $(seq 60); do [ -e "$sync/ready" ] && break; sleep 1; done
          test -e "$sync/ready" || { docker logs "$R-reader"; exit 1; }
          # A probe anyone may write (0666 in the 1777 tmpfs): only Landlock
          # can refuse the reader's writes.
          docker run -d --name "$R-shm" --ipc=shareable "$IMG" sh -c 'echo probe > /dev/shm/.ll11-tmp && chmod 0666 /dev/shm/.ll11-tmp && mv /dev/shm/.ll11-tmp /dev/shm/ll11-probe && sleep 300'
          timeout 30 sh -c "until docker exec '$R-shm' test -e /dev/shm/ll11-probe; do sleep 0.2; done"
          docker inspect --format '{{.Id}}' "$R-shm" > "$sync/shm-id"
          rc=$(docker wait "$R-reader")
          docker logs "$R-reader" 2>&1 | tee landlock.log
          test "$rc" = 0
          grep -q -- '--- PASS: TestIntegrationLandlockShm' landlock.log
      - name: remove the test containers
        if: always()
        run: |
          [ -n "${R:-}" ] || exit 0
          docker rm -f "$R-a" "$R-b" "other-$R" "locklog-console-it-$R" "$R-local" "$R-reader" "$R-shm" >/dev/null 2>&1 || true

  # The P1 demo end to end: the image, the launcher's console approved at
  # its terminal (script(1): the console refuses an input that is not
  # one), a file source over rotated and compressed logs, and an MCP client
  # speaking to the launcher's mcp (test/e2e, build tag e2e).
  e2e-docker:
    name: e2e (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: docker build -t locklog .
      - name: test_count_rotated_gz
        shell: bash
        run: |
          set -euxo pipefail
          d="$RUNNER_TEMP/e2e-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          mkdir -m 0755 "$d"
          LOCKLOG_E2E_DIR="$d" go test -tags e2e -count=1 -v -timeout 15m -run '^TestCountRotatedGz$' ./test/e2e 2>&1 | tee e2e.log
          grep -q -- '--- PASS: TestCountRotatedGz' e2e.log
      - name: remove the console and the volumes
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=locklog.console=1)
          [ -z "$ids" ] || docker rm -f $ids >/dev/null
          docker volume rm locklog-run locklog-home >/dev/null 2>&1 || true

  # The five-minute path, timed from setup to the first answer (the image is
  # built before the clock starts): the launcher installed on PATH, `setup
  # --yes --no-production --agent host`, the console, and an MCP client
  # spawning the server the written .mcp.json names (test/e2e).
  five-minutes:
    name: five-minutes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: docker build -t locklog .
      - name: build the e2e test
        run: go test -c -tags e2e -o "$RUNNER_TEMP/e2e.test" ./test/e2e
      - name: TestFiveMinutes
        shell: bash
        run: |
          set -euxo pipefail
          d="$RUNNER_TEMP/e2e-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          mkdir -m 0755 "$d"
          cd test/e2e
          LOCKLOG_E2E_DIR="$d" "$RUNNER_TEMP/e2e.test" -test.count=1 -test.v -test.timeout 15m -test.run '^TestFiveMinutes$' 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep -q -- '--- PASS: TestFiveMinutes' "$RUNNER_TEMP/e2e.log"
      - name: remove the consoles and the volumes
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=locklog.console=1)
          [ -z "$ids" ] || docker rm -f $ids >/dev/null
          docker volume rm locklog-run locklog-home >/dev/null 2>&1 || true

  # The own-container recipe: an agent image built on the runner from the
  # snippet setup prints, run as its non-root agent user, calls the console.
  e2e-own-container:
    name: own-container recipe (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CGO_ENABLED: "0"
      LOCKLOG_E2E_AGENT_BASE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: docker build -t locklog .
      - name: build the e2e test
        run: go test -c -tags e2e -o "$RUNNER_TEMP/e2e.test" ./test/e2e
      - name: TestOwnContainer
        shell: bash
        run: |
          set -euxo pipefail
          d="$RUNNER_TEMP/e2e-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          mkdir -m 0755 "$d"
          cd test/e2e
          LOCKLOG_E2E_DIR="$d" "$RUNNER_TEMP/e2e.test" -test.count=1 -test.v -test.timeout 30m -test.run '^TestOwnContainer(UID)?$' 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep -q -- '--- PASS: TestOwnContainer ' "$RUNNER_TEMP/e2e.log"
          grep -q -- '--- PASS: TestOwnContainerUID ' "$RUNNER_TEMP/e2e.log"
      - name: remove the consoles and the volumes
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=locklog.console=1)
          [ -z "$ids" ] || docker rm -f $ids >/dev/null
          docker volume rm locklog-run locklog-home >/dev/null 2>&1 || true

  # The host-agent guard end to end: the launcher's mcp on a production
  # profile served by a real console is refused (E_PRODUCTION_HOST_AGENT).
  e2e-production-guard:
    name: production guard (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: docker build -t locklog .
      - name: build the e2e test
        run: go test -c -tags e2e -o "$RUNNER_TEMP/e2e.test" ./test/e2e
      - name: TestProductionGuard
        shell: bash
        run: |
          set -euxo pipefail
          d="$RUNNER_TEMP/e2e-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          mkdir -m 0755 "$d"
          cd test/e2e
          LOCKLOG_E2E_DIR="$d" "$RUNNER_TEMP/e2e.test" -test.count=1 -test.v -test.timeout 15m -test.run '^TestProductionGuard$' 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep -q -- '--- PASS: TestProductionGuard' "$RUNNER_TEMP/e2e.log"
      - name: remove the consoles and the volumes
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=locklog.console=1)
          [ -z "$ids" ] || docker rm -f $ids >/dev/null
          docker volume rm locklog-run locklog-home >/dev/null 2>&1 || true

  # install.sh of this commit against the latest published release: the
  # signatures (checksums.txt and the images), the checksum, the launcher
  # and its image. Before the first release there is nothing to install.
  install-latest:
    name: install.sh (latest release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: install.sh, locklog version
        run: |
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/DavidGodefroid/locklog/releases/latest)
          tag=${tag##*/}
          case "$tag" in
          v[0-9]*) ;;
          *) echo "::notice::no published release yet: nothing to install"; exit 0 ;;
          esac
          sh scripts/install.sh
          test "$(stat -c %u:%a /usr/local/bin/locklog)" = 0:755
          grep -q '^image_digest=sha256:' /usr/local/bin/locklog
          locklog version | tee version.txt
          grep -q "^locklog launcher ${tag#v} (image ghcr.io/davidgodefroid/locklog@sha256:" version.txt
