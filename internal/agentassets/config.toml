# locklog: the project's log sources. The console (`lox run` starts it)
# reads this file and shows every change that loosens it before it applies.
# `locklog profile add` writes a profile from what it finds on this host.
version = 1

# [profiles.staging]
# production = false
#
# [profiles.staging.sources.nginx]
# kind = "file"
# paths = ["/var/log/nginx/access.log*"]
# format = "combined"
#
# [profiles.staging.sources.system]
# kind = "journald"
# units = ["nginx.service"]
